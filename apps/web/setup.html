    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--saffron); }
    footer { display: flex; justify-content: space-between; gap: 16px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    @media (max-width: 520px) { .shell { width: min(100% - 28px, 760px); padding-top: 22px; } main { padding: 54px 0 70px; } footer { flex-direction: column; gap: 4px; } }
